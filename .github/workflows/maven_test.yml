# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Install Android platform 25
      run: sdkmanager "platforms;android-25"
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Test with Maven
      run: |
        cd ../
        git clone -b mandoline-2.10.0 https://github.com/resess/FlowDroid
        cd FlowDroid
        mvn -DskipTests -B install -pl soot-infoflow-android -am --file pom.xml
        cd ..
        git clone https://github.com/resess/DynamicSlicingCore
        cd DynamicSlicingCore/core
        mvn -DskipTests -B package install --file pom.xml
        cd ../../Mandoline/Mandoline/
        mvn -DskipTests -B package install --file pom.xml
        mvn test
    - name: E2E — instrument Dataset/1.anki
      timeout-minutes: 10
      run: |
        java -cp "Mandoline/target/mandoline-jar-with-dependencies.jar:Mandoline/target/lib/*" \
          ca.ubc.ece.resess.slicer.dynamic.mandoline.Slicer \
          -m i \
          -a Dataset/1.anki/1.anki.apk \
          -p "$ANDROID_SDK_ROOT/platforms" \
          -c FlowDroid/soot-infoflow-android/AndroidCallbacks.txt \
          -o /tmp/e2e-out \
          -lc ../DynamicSlicingCore/DynamicSlicingLoggingClasses/DynamicSlicingLogger.jar
        test -s /tmp/e2e-out/1.anki_i.apk
        echo "Instrumented APK produced: $(stat -c%s /tmp/e2e-out/1.anki_i.apk) bytes"
