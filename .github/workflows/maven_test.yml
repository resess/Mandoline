# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Test with Maven
      run: |
        cd ../
        git clone -b mandoline-2.10.0 https://github.com/resess/FlowDroid
        cd FlowDroid
        mvn -DskipTests -B install -pl soot-infoflow-android -am --file pom.xml
        cd ..
        git clone https://github.com/resess/DynamicSlicingCore
        cd DynamicSlicingCore/core
        mvn -DskipTests -B package install --file pom.xml
        cd ../../Mandoline/Mandoline/
        mvn -DskipTests -B package install --file pom.xml
        mvn test
